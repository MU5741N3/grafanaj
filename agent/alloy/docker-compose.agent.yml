services:
  alloy:
    image: grafana/alloy:v1.0.0
    container_name: grafana-alloy-agent
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      - HOSTNAME=maquina-cliente-01
      # Cambia esta URL con la IP o dominio de tu servidor central
      - CENTRAL_REMOTE_WRITE_URL=http://TU_IP_CENTRAL:9090/api/v1/write
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
